name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose syntax
        shell: bash
        run: |
          docker compose --env-file .env.ci -f compose.yml config -q

      - name: Build backend image
        shell: bash
        run: |
          docker build -t sixthfinger-backend-ci:latest .

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Archive repo
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            -czf /tmp/6thfinger-backend.tar.gz \
            .

      - name: Ensure deploy path exists
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"

      - name: Upload archive
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "${{ secrets.SSH_PORT }}" \
            /tmp/6thfinger-backend.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/6thfinger-backend.tar.gz"

      - name: Deploy on server
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
              set -Eeuo pipefail

              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
              ARCHIVE_PATH="/tmp/6thfinger-backend.tar.gz"

              mkdir -p "$DEPLOY_PATH"

              find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +

              tar -xzf "$ARCHIVE_PATH" -C "$DEPLOY_PATH"
              rm -f "$ARCHIVE_PATH"

              chmod +x "$DEPLOY_PATH/scripts/deploy.sh"

              cd "$DEPLOY_PATH"
              bash "$DEPLOY_PATH/scripts/deploy.sh" "$DEPLOY_PATH"
          EOF