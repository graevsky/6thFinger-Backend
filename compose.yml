name: sixthfinger-backend

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: sixthfinger-backend:latest
    env_file:
      - path: ./.env
        required: false
    command: ["sh", "/app/docker/migrate.sh"]
    networks:
      - backend_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sixthfinger-backend:latest
    container_name: finger_backend_api
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "8000"
    command: ["sh", "/app/docker/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend_net

  caddy:
    image: caddy:2
    container_name: finger_backend_caddy
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend_net

volumes:
  caddy_data:
  caddy_config:

networks:
  backend_net:
    external: true
    name: finger_backend_net